services:
  postgres:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_secure_pass_123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application services run only under the "full" profile:
  #   docker-compose --profile full up -d   -> databases + backend + frontend
  #   docker-compose up -d                  -> databases only (for `npm run dev` + `mvnw spring-boot:run`)
  backend:
    build: .
    profiles: ["full"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USER: inventory_user
      DB_PASSWORD: inventory_secure_pass_123
      MONGO_URI: mongodb://mongo_user:mongo_pass@mongodb:27017/inventory_catalog?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Dev-only secrets for local Docker. Override with real values in any real environment.
      JWT_ACCESS_SECRET: docker-compose-access-secret-change-me-0123456789abcdef
      JWT_REFRESH_SECRET: docker-compose-refresh-secret-change-me-fedcba9876543210

  frontend:
    build: ./frontend
    profiles: ["full"]
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
  redisdata:
